services:
  postgres:
    image: postgres:18-alpine
    container_name: baaki-postgres
    environment:
      POSTGRES_DB: baaki
      POSTGRES_USER: baaki
      POSTGRES_PASSWORD: baaki
    ports:
      # 5432 conflicts with another Postgres instance on this host (WSL2) -
      # mapped to a non-default host port instead.
      - "55432:5432"
    volumes:
      - baaki-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baaki -d baaki"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: baaki-redis
    ports:
      # 6379 conflicts with another Redis instance on this host (WSL2) -
      # mapped to a non-default host port instead.
      - "56379:6379"
    volumes:
      - baaki-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: baaki-zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    container_name: baaki-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      # host.docker.internal is Docker Desktop-only by default on Linux -
      # this makes the same compose file work there too.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: baaki-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - baaki-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  baaki-postgres-data:
  baaki-redis-data:
  baaki-grafana-data:
