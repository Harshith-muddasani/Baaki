spring:
  application:
    name: expense-settlement-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/baaki}
    username: ${DB_USERNAME:baaki}
    password: ${DB_PASSWORD:baaki}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
