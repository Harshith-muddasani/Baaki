spring:
  application:
    name: expense-settlement-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/baaki}
    username: ${DB_USERNAME:baaki}
    password: ${DB_PASSWORD:baaki}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # db/loadtest is a permanent 650k-row synthetic dataset (see
    # docs/benchmarks.md) - real for the dev database, but deliberately
    # excluded from the Testcontainers IT test's Flyway locations (see
    # @TestPropertySource on ExpenseSettlementServiceApplicationIT) so every
    # test run's fresh Postgres doesn't pay to insert it on every run.
    # FLYWAY_LOCATIONS is overridden to just classpath:db/migration on the
    # deployed instance - the load-test dataset is dev-only benchmarking
    # data (docs/benchmarks.md), not something a public demo should carry.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/loadtest}

server:
  # Most PaaS (Railway included) inject $PORT and expect the app to bind to
  # it; SERVER_PORT still wins if explicitly set, for local/other deploys.
  port: ${SERVER_PORT:${PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# Tracing via the OpenTelemetry project's own Spring Boot starter, not
# Spring Boot's Micrometer bridge - that combination's autoconfiguration
# never actually wired up an OTel Tracer bean in this Spring Boot version
# (fell back to NoopTracerAutoConfiguration silently), verified by checking
# /actuator/beans for a real Tracer. This is OTel's own SDK autoconfigure
# module, independent of that bridge, and uses its own `otel.*` namespace.
otel:
  service:
    name: expense-settlement-service
  traces:
    # No Zipkin instance is deployed alongside the demo - set
    # OTEL_TRACES_EXPORTER=none there instead of letting every span export
    # fail silently against an unreachable localhost endpoint.
    exporter: ${OTEL_TRACES_EXPORTER:zipkin}
    sampler: always_on # 100% in dev; a real prod deployment would sample well below this
  exporter:
    zipkin:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    exporter: none # already have Micrometer + Prometheus for metrics
  logs:
    exporter: none # already have structured JSON logs via logback-spring.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
